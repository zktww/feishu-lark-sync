name: Feature request / 功能建议
description: Describe a use case and its boundaries / 描述场景和边界
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 需要解决的问题
      description: Describe the workflow without private data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal and alternatives / 建议与替代方案
      description: Note any new permissions, account requirements, external services or deletion behavior.
    validations:
      required: true
