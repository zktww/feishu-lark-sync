name: Bug report / 问题反馈
description: Report a reproducible, sanitized bug / 请勿提交私人数据
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs, data.json, note backups or a full vault. Report vulnerabilities privately using SECURITY.md.
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: Plugin, Obsidian, lark-cli, OS (include architecture)
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior / 复现步骤与预期
      description: Use synthetic examples. Include source type, media mode and manual/scheduled sync.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际表现
      description: Sanitized error and screenshots only. Do not paste raw CLI auth output.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I removed private data and searched existing issues / 已脱敏并搜索已有问题
          required: true
